<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container_login" id="container_login">

  <!-- LADO ESQUERDO -->
  <div class="side left">

    <!-- LOGIN -->
    <div class="form login">
      <h2>Faça seu login</h2>

      <div class="input-box">
        <i class="fa fa-envelope"></i>
        <input type="email" id="loginEmail" placeholder="Email">
      </div>

      <div class="input-box">
        <i class="fa fa-lock"></i>
        <input type="password" id="loginSenha" placeholder="Senha">
      </div>

      <button class="btn primary" onclick="login()">Entrar</button>
    </div>

    <!-- CADASTRO -->
    <div class="form cadastro">
      <h2>Cadastro</h2>

      <div class="input-box">
        <i class="fa fa-user"></i>
        <input type="text" id="cadNome" placeholder="Nome">
      </div>

      <div class="input-box">
        <i class="fa fa-envelope"></i>
        <input type="email" id="cadEmail" placeholder="Email">
      </div>

      <div class="input-box">
        <i class="fa fa-lock"></i>
        <input type="password" id="cadSenha" placeholder="Senha">
      </div>

      <button class="btn glow" onclick="register()">Cadastrar</button>
    </div>

  </div>

  <!-- LADO DIREITO -->
  <div class="side right">

    <div class="panel login-panel">
      <img src="assets/imagens/logolotuss.png" alt="Logo">
  <h2>Acesse sua conta novamente para continuar usando nossos serviços</h2>
  <p>Ainda não tem uma conta?</p>
  <button class="btn outline" onclick="showRegister()">Cadastre-se</button>
</div>

   <div class="panel cadastro-panel">
    <img src="assets/imagens/logolotuss.png" alt="Logo">
  <h2>Seja bem-vindo!</h2>
  <p>Crie uma conta para ficar por dentro e usufruir dos nossos serviços</p>
  <p>Já possui uma conta?</p>
  <button class="btn neon" onclick="showLogin()">Entrar</button>
</div>

  </div>

</div>

<script src="js/login.js" defer></script>
</body>
</html>
